[project]
name = "create-my-card-debug-tools"
version = "0.1.0"
description = "Local debugging tools for the AI widget card service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "json5>=0.17.3",
    "widget-service",
]

[project.scripts]
debug_tools = "debug_tools.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["."]
dev-mode-dirs = [".."]
artifacts = [
    "/a2ui_render/**",
    "!/a2ui_render/.hvigor/**",
    "!/a2ui_render/.preview/**",
    "!/a2ui_render/node_modules/**",
    "!/a2ui_render/oh_modules/**",
    "!/a2ui_render/test-output/**",
    "!/a2ui_render/**/.test/**",
    "!/a2ui_render/**/build/**",
    "!/a2ui_render/local.properties",
]
exclude = [
    "/tests/**",
    "/pyproject.toml",
    "/uv.lock",
    "/.venv/**",
    "/a2ui_render/.hvigor/**",
    "/a2ui_render/.preview/**",
    "/a2ui_render/node_modules/**",
    "/a2ui_render/oh_modules/**",
    "/a2ui_render/test-output/**",
    "/a2ui_render/**/.test/**",
    "/a2ui_render/**/build/**",
    "/a2ui_render/local.properties",
]

[tool.hatch.build.targets.wheel.sources]
"." = "debug_tools"

[tool.uv.sources]
widget-service = { path = "../widget_service", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP009"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "../widget_service/tests"]
pythonpath = ["../widget_service/cloud", "../widget_service", ".."]
